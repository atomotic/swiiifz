<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>swiiifz · Universal Viewer</title>
        <meta name="description" content="IIIF Image API level 0 served from a single zip file by a Service Worker, shown in Universal Viewer." />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/universalviewer@4.4.4/dist/uv.css" />
        <script src="https://cdn.jsdelivr.net/npm/universalviewer@4.4.4/dist/umd/UV.js"></script>
        <link rel="stylesheet" href="viewer.css" />
    </head>
    <body>
        <header>
            <h1><a href="./">sw<span class="iiif"><span>i</span><span>i</span><span>i</span><span>f</span></span>z</a></h1>
            <span>Universal Viewer 4 · IIIF tiles served from <a href="zip/5l69cr5dp7.zip">one zip file</a> by a Service Worker

            <span class="spacer"></span>
            <span id="status">starting service worker…</span>
            <a href="https://github.com/atomotic/swiiifz">source</a>
        </header>
        <div id="viewer" class="uv"></div>

        <script type="module">
            import { ready } from './boot.js';

            const manifest = await ready();
            UV.init('viewer', { iiifManifestId: manifest });
        </script>
    </body>
