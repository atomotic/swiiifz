<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>swiiifz · Mirador</title>
        <meta name="description" content="IIIF Image API level 0 served from a single zip file by a Service Worker, shown in Mirador." />
        <script src="https://cdn.jsdelivr.net/npm/mirador@4.3.0/dist/mirador.min.js"></script>
        <link rel="stylesheet" href="viewer.css" />
    </head>
    <body>
        <header>
            <h1><a href="../">sw<span class="iiif"><span>i</span><span>i</span><span>i</span><span>f</span></span>z</a></h1>
            <span>Mirador 4 · IIIF tiles served from <a href="../zip/5l69cr5dp7.zip">one zip file</a> by a Service Worker
                (<a href="../zip/5l69cr5dp7.pdf">source PDF</a>)</span>
            <span class="spacer"></span>
            <a href="https://github.com/atomotic/swiiifz">source</a>
        </header>
        <div id="viewer"></div>

        <script type="module">
            import { open } from '../lib/swiiifz.js';

            const { manifest } = await open('../zip/5l69cr5dp7.zip', { sw: '../sw.js' });
            Mirador.viewer({
                id: 'viewer',
                windows: [{ manifestId: manifest, thumbnailNavigationPosition: 'far-bottom' }],
                window: { allowClose: false, allowMaximize: false },
                workspaceControlPanel: { enabled: false },
            });
        </script>
    </body>
</html>
